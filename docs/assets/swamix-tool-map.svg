<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">A practical toolkit for Pi agents</title><desc id="desc">Execution, research, evidence, delegation and context management are complementary tools that a Pi agent can use as needed.</desc>
<rect width="1440" height="440" rx="24" fill="#101b29"/>
<text x="64" y="70" fill="#f6f5f0" font-family="Arial, sans-serif" font-size="30" font-weight="700">One agent. A toolkit for the work around it.</text>
<text x="64" y="108" fill="#aec1ca" font-family="Arial, sans-serif" font-size="18">Choose the components your workflow needs; none are a substitute for review or security controls.</text>
<rect x="64" y="166" width="190" height="140" rx="14" fill="#183348" stroke="#58d7d0" stroke-width="2"/>
<text x="88" y="213" fill="#7fe1d9" font-family="Arial, sans-serif" font-size="16" font-weight="700">01 · EXECUTE</text><text x="88" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">script</text><text x="88" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Bash + Python</text>
<rect x="272" y="166" width="200" height="140" rx="14" fill="#183348" stroke="#407e92"/><text x="296" y="213" fill="#7fe1d9" font-family="Arial, sans-serif" font-size="16" font-weight="700">02 · RESEARCH</text><text x="296" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">search + fetch</text><text x="296" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Discover and read</text>
<rect x="490" y="166" width="190" height="140" rx="14" fill="#183348" stroke="#407e92"/><text x="514" y="213" fill="#7fe1d9" font-family="Arial, sans-serif" font-size="16" font-weight="700">03 · VERIFY</text><text x="514" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">evidence</text><text x="514" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Source-backed quotes</text>
<rect x="698" y="166" width="200" height="140" rx="14" fill="#183348" stroke="#407e92"/><text x="722" y="213" fill="#7fe1d9" font-family="Arial, sans-serif" font-size="16" font-weight="700">04 · DELEGATE</text><text x="722" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">subagentx</text><text x="722" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Bounded child work</text>
<rect x="916" y="166" width="230" height="140" rx="14" fill="#183348" stroke="#407e92"/><text x="940" y="213" fill="#7fe1d9" font-family="Arial, sans-serif" font-size="16" font-weight="700">05 · MANAGE</text><text x="940" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">context</text><text x="940" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Router + compaction</text>
<rect x="1164" y="166" width="212" height="140" rx="14" fill="#183348" stroke="#d6ab6a"/><text x="1188" y="213" fill="#efca90" font-family="Arial, sans-serif" font-size="16" font-weight="700">06 · EXPERIENCE</text><text x="1188" y="251" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">interface</text><text x="1188" y="280" fill="#bbccd3" font-family="Arial, sans-serif" font-size="15">Formatter + local UI</text>
